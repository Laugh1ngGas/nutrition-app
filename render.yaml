# Render Blueprint — deploys backend + frontend as free web services.
#
# Postgres and Redis are NOT defined here: Render's free tier has no private
# services and its own free managed Postgres expires after 30 days, so this
# stack uses external free-tier providers instead — Neon or Supabase for
# Postgres, Upstash for Redis. Create those first, then fill in the
# DATABASE_URL / REDIS_URL secrets below when deploying this blueprint.
#
# Free-tier web services can SEND private-network requests but can't RECEIVE
# them, so frontend reaches backend over its public HTTPS URL rather than an
# internal address — see BACKEND_HOST below and frontend/vite.config.ts.
#
# fromService's "host" property resolves to Render's PRIVATE network
# hostname (unreachable — free services can't receive private traffic), not
# the public onrender.com one, and there's no blueprint mechanism to pull
# another service's RENDER_EXTERNAL_URL. So BACKEND_HOST/FRONTEND_URL below
# are hardcoded to the actual assigned hostnames (confirmed via the Render
# dashboard) rather than derived — these are stable for the service's
# lifetime, only need updating if a service is deleted and recreated.

services:
  - type: web
    name: nutrition-app-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Paste the full connection string from Neon/Supabase (requires
      # sslmode=require or equivalent — already handled in database.ts).
      - key: DATABASE_URL
        sync: false
      # Paste the full rediss:// connection string from Upstash.
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      # Defense-in-depth only — the browser never calls the backend directly,
      # it goes through the frontend's /api proxy, so this doesn't gate the
      # main flow.
      - key: FRONTEND_URL
        value: https://nutrition-app-frontend-uisq.onrender.com

  - type: web
    name: nutrition-app-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_HOST
        value: nutrition-app-backend-8kgv.onrender.com
